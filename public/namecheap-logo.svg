<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient with glassmorphism effect -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Shine overlay for glass effect -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    
    <!-- Cart gradient -->
    <linearGradient id="cartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glass blur effect -->
    <filter id="glass-blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" opacity="0.95"/>
  
  <!-- Glass shine overlay -->
  <circle cx="100" cy="100" r="90" fill="url(#glassShine)" opacity="0.6"/>
  
  <!-- Inner glow circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" filter="url(#glass-blur)"/>
  
  <!-- Shopping cart icon with modern style -->
  <g transform="translate(100, 92)" filter="url(#glow)">
    <!-- Cart body with gradient -->
    <path d="M -28 -22 L -24 6 L 22 6 L 26 -22 Z" fill="url(#cartGradient)" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Cart handle with smooth curves -->
    <path d="M -33 -22 L -28 -22 M 26 -22 L 31 -22" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M -33 -27 Q -33 -22 -28 -22" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Wheels with shadow effect -->
    <circle cx="-14" cy="16" r="4.5" fill="#1a1a1a"/>
    <circle cx="-14" cy="16" r="2.5" fill="#3a3a3a"/>
    <circle cx="11" cy="16" r="4.5" fill="#1a1a1a"/>
    <circle cx="11" cy="16" r="2.5" fill="#3a3a3a"/>
    
    <!-- Modern price tag with gradient -->
    <g transform="translate(0, -8)">
      <path d="M -12 -8 L 6 -8 L 11 -3 L 11 2 L -12 2 Z" fill="#FFD700" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M -12 -8 L 6 -8 L 11 -3 L 11 2 L -12 2 Z" fill="url(#glassShine)" opacity="0.4"/>
      <circle cx="3" cy="-3" r="2.2" fill="#1a1a1a"/>
      <circle cx="3" cy="-3" r="1" fill="#FFA500"/>
      
      <!-- Discount percentage symbol -->
      <text x="-8" y="0" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#1a1a1a">%</text>
    </g>
  </g>
  
  <!-- Brand text with gradient -->
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="100" y="168" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" letter-spacing="0.5">Namecheap</text>
  
  <!-- Outer ring with glass effect -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
</svg>
