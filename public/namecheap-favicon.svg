<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cartIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a3a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="64" cy="64" r="58" fill="url(#faviconGradient)"/>
  
  <!-- Shopping cart icon -->
  <g transform="translate(64, 60)">
    <!-- Cart body -->
    <path d="M -20 -16 L -16 3 L 13 3 L 16 -16 Z" fill="url(#cartIconGradient)" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Cart handle -->
    <path d="M -23 -16 L -20 -16" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    <path d="M -23 -20 Q -23 -16 -20 -16" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
    
    <!-- Wheels -->
    <circle cx="-10" cy="10" r="2.5" fill="#1a1a1a"/>
    <circle cx="7" cy="10" r="2.5" fill="#1a1a1a"/>
    
    <!-- Price tag inside cart -->
    <path d="M -6 -7 L 3 -7 L 6 -4 L 6 0 L -6 0 Z" fill="#FFD700" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="1" cy="-3.5" r="1.2" fill="#1a1a1a"/>
  </g>
  
  <!-- Subtle outer ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
</svg>
