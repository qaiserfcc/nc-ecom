<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern gradient -->
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- Glass shine -->
    <linearGradient id="faviconShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    
    <!-- Cart gradient -->
    <linearGradient id="faviconCartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="58" fill="url(#faviconGradient)" opacity="0.95"/>
  
  <!-- Glass shine overlay -->
  <circle cx="64" cy="64" r="58" fill="url(#faviconShine)" opacity="0.6"/>
  
  <!-- Inner glow -->
  <circle cx="64" cy="64" r="55" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
  
  <!-- Shopping cart icon -->
  <g transform="translate(64, 59)">
    <!-- Cart body -->
    <path d="M -19 -14 L -16 4 L 14 4 L 17 -14 Z" fill="url(#faviconCartGradient)" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Cart handle -->
    <path d="M -22 -14 L -19 -14" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M -22 -18 Q -22 -14 -19 -14" stroke="#1a1a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    
    <!-- Wheels -->
    <circle cx="-9" cy="11" r="2.8" fill="#1a1a1a"/>
    <circle cx="-9" cy="11" r="1.5" fill="#3a3a3a"/>
    <circle cx="8" cy="11" r="2.8" fill="#1a1a1a"/>
    <circle cx="8" cy="11" r="1.5" fill="#3a3a3a"/>
    
    <!-- Price tag -->
    <g transform="translate(0, -5)">
      <path d="M -7 -6 L 4 -6 L 7 -3 L 7 1 L -7 1 Z" fill="#FFD700" stroke="#1a1a1a" stroke-width="1.2"/>
      <path d="M -7 -6 L 4 -6 L 7 -3 L 7 1 L -7 1 Z" fill="url(#faviconShine)" opacity="0.4"/>
      <circle cx="1.5" cy="-2.5" r="1.4" fill="#1a1a1a"/>
      <circle cx="1.5" cy="-2.5" r="0.7" fill="#FFA500"/>
      
      <!-- % symbol -->
      <text x="-5" y="-1" font-family="Arial" font-size="5" font-weight="bold" fill="#1a1a1a">%</text>
    </g>
  </g>
  
  <!-- Outer rings -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="59.5" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
</svg>
